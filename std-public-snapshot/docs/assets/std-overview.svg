<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Sequence Transformation Dynamics</title>
<desc id="desc">0011 and 0101 have equal symbol counts but different cyclic pair counts.</desc>
<rect width="1200" height="300" rx="20" fill="#10243a"/>
<text x="48" y="63" fill="#75e1ce" font-family="sans-serif" font-size="17" letter-spacing="3">SEQUENCE TRANSFORMATION DYNAMICS</text>
<text x="48" y="116" fill="white" font-family="sans-serif" font-size="35" font-weight="700">How much local information</text>
<text x="48" y="162" fill="white" font-family="sans-serif" font-size="35" font-weight="700">is enough?</text>
<text x="48" y="223" fill="#c3d0dc" font-family="sans-serif" font-size="19">Exact counts. Local rules. Checkable witnesses.</text>
<rect x="710" y="40" width="440" height="98" rx="12" fill="#1d3a50"/>
<rect x="710" y="159" width="440" height="98" rx="12" fill="#1d3a50"/>
<text x="739" y="99" fill="#75e1ce" font-family="monospace" font-size="38">0011</text>
<text x="899" y="81" fill="#e6edf3" font-family="sans-serif" font-size="17">two zeros, two ones</text>
<text x="899" y="110" fill="#ffcc8a" font-family="sans-serif" font-size="17">one cyclic 00 pair</text>
<text x="739" y="218" fill="#75e1ce" font-family="monospace" font-size="38">0101</text>
<text x="899" y="200" fill="#e6edf3" font-family="sans-serif" font-size="17">two zeros, two ones</text>
<text x="899" y="229" fill="#ffcc8a" font-family="sans-serif" font-size="17">no cyclic 00 pair</text>
</svg>
